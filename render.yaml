services:
  - type: web
    name: office-intelligence-workers-agent
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn office_intelligence.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OFFICE_INTELLIGENCE_ALLOWED_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: mock
      - key: PYTHONUNBUFFERED
        value: "1"
