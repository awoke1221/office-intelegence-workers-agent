services:
  - type: web
    name: office-intelligence-workers-agent
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn backend_api:app --workers 1 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OFFICE_INTELLIGENCE_ALLOWED_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: mock
